{% set name = "opentelemetry-instrumentation-fastapi" %}
{% set version = "0.66b1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/opentelemetry_instrumentation_fastapi-{{ version }}.tar.gz
  sha256: 584cf9d2c4417ff8b2d6ff2bc606bfe13c8b3456018bf94f50f2cf658492505b

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation  # [not win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-compile  # [win]
  # Skip compiling byte code to avoid extremely long paths in the conda package cache
  # Due to the nested structure of this package and the long build string, environments
  # can exceed the Windows path limit if installed into LOCALAPPDATA
  skip_compile_pyc:  # [win]
    - "*"            # [win]

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - opentelemetry-api >=1.12,<2
    - opentelemetry-instrumentation =={{ version }}
    - opentelemetry-instrumentation-asgi =={{ version }}
    - opentelemetry-semantic-conventions =={{ version }}
    - opentelemetry-util-http =={{ version }}
  run_constrained:
    - fastapi >=0.92,<1

test:
  imports:
    - opentelemetry
    - opentelemetry.instrumentation.fastapi
  requires:
    - pip
    # fastapi is imported at module level in
    # opentelemetry/instrumentation/fastapi/__init__.py; needed for
    # the import test even though it's only in run_constrained.
    - fastapi >=0.92,<1
  commands:
    - pip check

about:
  home: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-fastapi
  summary: OpenTelemetry FastAPI Instrumentation
  description: |
    OpenTelemetry instrumentation for FastAPI applications. Wraps a FastAPI
    ASGI app to automatically generate spans for incoming requests,
    propagate trace context, and emit standard HTTP semantic-convention
    attributes. Built on top of opentelemetry-instrumentation-asgi.
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  doc_url: https://opentelemetry-python-contrib.readthedocs.io/en/latest/instrumentation/fastapi/fastapi.html
  dev_url: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/v0.66b1/instrumentation/opentelemetry-instrumentation-fastapi

extra:
  recipe-maintainers:
    - mariusvniekerk
