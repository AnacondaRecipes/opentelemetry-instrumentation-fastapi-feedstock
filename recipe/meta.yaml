{% set name = "opentelemetry-instrumentation-fastapi" %}
{% set version = "0.41b0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/opentelemetry_instrumentation_fastapi-{{ version }}.tar.gz
  sha256: eb4ceefe8b944fc9ea5e61fa558b99afd1285431b563f3f0104ac177cde4dfe5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python 
    - pip
    - hatchling
  run:
    - python
    - opentelemetry-api
    - opentelemetry-instrumentation-asgi
    - opentelemetry-instrumentation 
    - opentelemetry-semantic-conventions
    - opentelemetry-util-http
    # - requests ~=2.23
    # - opentelemetry-test-utils ==0.37b0
    # - opentelemetry-instrumentation-fastapi 
    # - httpx ~=0.22
    # - fastapi <=0.90.1
    # - requests ~=2.23
    # - opentelemetry-test-utils ==0.38b0
    # - opentelemetry-instrumentation-fastapi 
    # - httpx ~=0.22
    # - fastapi ~=0.58
    # - requests ~=2.23
    # - opentelemetry-test-utils ==0.39b0
    # - opentelemetry-instrumentation-fastapi 
    # - httpx ~=0.22
    # - fastapi ~=0.58
    # - requests ~=2.23
    # - opentelemetry-test-utils ==0.40b0
    # - opentelemetry-instrumentation-fastapi 
    # - httpx ~=0.22
    # - fastapi ~=0.58
    # - requests ~=2.23
    # - opentelemetry-test-utils ==0.41b0
    # - opentelemetry-instrumentation-fastapi 
    # - httpx ~=0.22
    # - fastapi ~=0.58

test:
  imports:
    - opentelemetry
    - opentelemetry.instrumentation
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-fastapi
  summary: OpenTelemetry FastAPI Instrumentation
  license: Apache-2.0
  license_file: LICENSE

extra:
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/70829
    reason: Dependency for chromadb
  recipe-maintainers:
    - ianaobi
  recipe-maintainers:
    - mariusvniekerk
